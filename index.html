<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contabilidad · Evasion Running</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--s:#12121a;--s2:#1a1a26;--b:#2a2a3a;--b2:#3a3a50;--t:#e8e8f0;--t2:#9090b0;--t3:#5a5a7a;--acc:#6c63ff;--acc2:#8b83ff;--green:#22c55e;--gd:#166534;--red:#ef4444;--rd:#7f1d1d;--amb:#f59e0b;--ad:#78350f;--cy:#06b6d4;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--s)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
.mono{font-family:var(--mono)}
/* LAYOUT */
#app{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--s);border-bottom:1px solid var(--b);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-ico{width:36px;height:36px;border-radius:8px;background:var(--acc);color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.brand-name{font-size:15px;font-weight:700}
.brand-sub{font-size:11px;color:var(--t3)}
.hkpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;gap:2px;padding:7px 12px;background:var(--s2);border:1px solid var(--b);border-radius:8px;min-width:120px}
.kpi.hl{border-color:var(--acc);background:#1a1833}
.kl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3)}
.kv{font-size:15px;font-weight:700;font-family:var(--mono)}
nav{display:flex;gap:2px;padding:8px 20px 0;background:var(--s);border-bottom:1px solid var(--b);overflow-x:auto}
.nb{display:flex;align-items:center;gap:6px;padding:8px 14px;border:none;background:transparent;color:var(--t2);font-family:var(--sans);font-size:13px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.nb:hover{color:var(--t)}
.nb.act{color:var(--acc2);border-bottom-color:var(--acc)}
main{flex:1;padding:20px;overflow-y:auto}
.view{display:none;animation:fi .25s ease}
.view.act{display:flex;flex-direction:column;gap:16px}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* CARDS */
.card{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:18px}
.ct{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:12px;font-weight:600}
/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}main{padding:12px}.hkpis{display:none}}
/* STAT CARDS */
.sc{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:5px}
.sl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);font-weight:600}
.sv{font-size:24px;font-weight:700;font-family:var(--mono);letter-spacing:-1px}
.ss{font-size:12px;color:var(--t2)}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--amb)}.cy{color:var(--cy)}
/* TABLES */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:7px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);font-weight:600;border-bottom:1px solid var(--b)}
td{padding:8px 10px;border-bottom:1px solid var(--b);color:var(--t)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--s2)}
/* ALERTS */
.alert{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.alert-danger{background:#200e0e;border:1px solid var(--rd)}
.alert-warn{background:#1c1400;border:1px solid var(--ad)}
.alert-info{background:#0d1a2a;border:1px solid #1e3a5f}
.at{font-size:13px;font-weight:600;margin-bottom:3px}
.ad2{font-size:12px;color:var(--t2);line-height:1.5}
/* PROGRESS */
.pr{display:flex;align-items:center;gap:8px;margin-bottom:9px;cursor:pointer}
.pl{width:150px;font-size:12px;color:var(--t2);flex-shrink:0;display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;flex-shrink:0}
.pbw{flex:1;height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.pbf{height:100%;border-radius:3px;transition:width .5s ease}
.pv{width:80px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--t);flex-shrink:0}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:11px;font-weight:700}
.bg{background:var(--gd);color:var(--green)}
.br{background:var(--rd);color:var(--red)}
.ba{background:var(--ad);color:var(--amb)}
.bb{background:#1e1b4b;color:var(--acc2)}
/* FORM */
.fg{margin-bottom:14px}
.fl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:5px;font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:9px 11px;background:var(--s2);border:1px solid var(--b2);border-radius:8px;color:var(--t);font-size:14px;font-family:var(--sans);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
select option{background:var(--s2)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:var(--sans);transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--acc);color:#fff}.btn-p:hover{opacity:.9}
.btn-s{background:var(--s2);color:var(--t);border:1px solid var(--b2)}.btn-s:hover{border-color:var(--acc)}
/* FILTER */
.fb{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.fbtn{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--b2);background:var(--s2);color:var(--t2);cursor:pointer;font-family:var(--sans);transition:all .15s}
.fbtn.act,.fbtn:hover{border-color:var(--acc);color:var(--acc2);background:#1a1833}
/* SCORE RING */
#scoreRing{position:relative;width:140px;height:140px;margin:0 auto 12px}
#scoreRing svg{transform:rotate(-90deg)}
#scoreLabel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.snum{font-size:36px;font-weight:800;font-family:var(--mono)}
.ssub{font-size:11px;color:var(--t3)}
canvas{max-height:220px}
</style>
</head>

</main>

// ── helpers ──────────────────────────────────────────────────────────────────
const fmt=(v,d=0)=>{const s=v<0;const a=Math.abs(v);return (s?'−':'')+a.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d})+' €'};
const fmtK=v=>(v/1000).toFixed(1)+'k';
const pct=v=>(v*100).toFixed(1)+'%';
const MNAMES=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const CATS=['Proveedores','Nóminas/Personal','Seg.Sociales TGSS','Suministros','Telecomunicaciones','Seguros','Préstamos','Tarjeta empresa','Impuestos/AEAT','Comisiones banco','Hucha Digital (ahorro)','Material/Compras','Otros'];
const CAT_COLORS={'Proveedores':'#6c63ff','Nóminas/Personal':'#22c55e','Impuestos/AEAT':'#ef4444','Préstamos':'#f59e0b','Tarjeta empresa':'#06b6d4','Seg.Sociales TGSS':'#ec4899','Comisiones banco':'#8b5cf6','Suministros':'#10b981','Seguros':'#0ea5e9','Telecomunicaciones':'#f97316','Otros':'#64748b','Hucha Digital (ahorro)':'#84cc16','Material/Compras':'#a78bfa'};

// ── load + merge localStorage ────────────────────────────────────────────────
function loadData(){
  try{
    const ex=localStorage.getItem('er_extra');
    if(ex){const e=JSON.parse(ex);return{daily:[...RAW.daily,...e.daily],expenses:[...RAW.expenses,...e.expenses]};}
  }catch(_){}
  return RAW;
}
let DATA=loadData();

// ── compute stats ────────────────────────────────────────────────────────────
function computeStats(d){
  const days=d.daily.filter(x=>x.ingresos.total>0||x.gastos.total>0);
  const totalI=days.reduce((s,x)=>s+x.ingresos.total,0);
  const totalG=days.reduce((s,x)=>s+x.gastos.total,0);
  const res=totalI-totalG;
  const byMonth={};
  for(const x of d.daily){
    if(!x.fecha||x.fecha==='TOTAL')continue;
    const m=x.fecha.slice(0,7);
    if(!byMonth[m])byMonth[m]={i:0,g:0};
    byMonth[m].i+=x.ingresos.total;
    byMonth[m].g+=x.gastos.total;
  }
  const byCategory={};
  for(const e of d.expenses){
    if(!byCategory[e.categoria])byCategory[e.categoria]=0;
    byCategory[e.categoria]+=e.importe;
  }
  const ch={caixabank:0,sabadell:0,bbva:0,online:0,paypal:0,transferencias:0,efectivo:0};
  for(const x of days){for(const k of Object.keys(ch))ch[k]+=(x.ingresos[k]||0);}
  return{totalI,totalG,res,days:days.length,byMonth,byCategory,channels:ch};
}
let STATS=computeStats(DATA);

// ── tab navigation ───────────────────────────────────────────────────────────
let charts={};
function destroyChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}
function makeChart(id,cfg){destroyChart(id);const c=document.getElementById(id);if(!c)return;charts[id]=new Chart(c,cfg);}

function goTab(name,btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('act'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('act'));
  document.getElementById('view-'+name).classList.add('act');
  btn.classList.add('act');
  renderTab(name);
}

function renderTab(name){
  if(name==='dashboard')renderDashboard();
  if(name==='ingresos')renderIngresos();
  if(name==='gastos')renderGastos();
  if(name==='salud')renderSalud();
  if(name==='nuevo')renderNuevo();
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
function renderDashboard(){
  const {totalI,totalG,res,days,byMonth,byCategory,channels}=STATS;
  const margen=totalI>0?res/totalI:0;
  
  // month chart data
  const mdata=Object.entries(byMonth).filter(([,v])=>v.i>0||v.g>0).map(([m,v])=>{
    const mo=parseInt(m.split('-')[1]);
    return{mes:MNAMES[mo],i:v.i,g:v.g,r:v.i-v.g};
  });

  // pie data
  const pieD=Object.entries(byCategory).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // alerts
  const alerts=[];
  const comm=byCategory['Comisiones banco']||0;
  if(comm/totalI>0.008)alerts.push({lv:'warn',t:'Comisiones bancarias elevadas',d:`${pct(comm/totalI)} sobre ingresos (${fmt(comm)}). Revisar tarifas TPV.`});
  const negM=Object.entries(byMonth).filter(([,v])=>v.i<v.g&&v.i>0);
  if(negM.length>0)alerts.push({lv:negM.length>1?'danger':'warn',t:`${negM.length} mes${negM.length>1?'es':''} en negativo`,d:negM.map(([m])=>{const mo=parseInt(m.split('-')[1]);return MNAMES[mo];}).join(', ')});
  const prov=byCategory['Proveedores']||0;
  if(prov/totalG>0.5)alerts.push({lv:'info',t:'Proveedores: +50% del gasto',d:`${fmt(prov)} · ${pct(prov/totalG)}. Normal en tienda, pero vigilar márgenes de compra.`});
  const loans=byCategory['Préstamos']||0;
  if(loans>0)alerts.push({lv:loans/totalG>0.07?'warn':'info',t:`Carga préstamos: ${fmt(loans)}`,d:`${pct(loans/totalG)} del gasto. Vigilar ratio deuda/ingresos.`});

  const alertHtml=alerts.map(a=>`
    <div class="alert alert-${a.lv}">
      <span style="flex-shrink:0;margin-top:1px">${a.lv==='danger'?'🔴':a.lv==='warn'?'⚠️':'ℹ️'}</span>
      <div><div class="at" style="color:${a.lv==='danger'?'var(--red)':a.lv==='warn'?'var(--amb)':'var(--cy)'}">${a.t}</div><div class="ad2">${a.d}</div></div>
    </div>
  `).join('');

  const channelHtml=Object.entries(channels).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>{
    const labels={caixabank:'Datáfono CaixaBank',sabadell:'Datáfono Sabadell',bbva:'Datáfono BBVA',online:'Online/Web',paypal:'PayPal',transferencias:'Transferencias',efectivo:'Efectivo'};
    const cols=['#6c63ff','#22c55e','#06b6d4','#f59e0b','#ec4899','#10b981','#f97316'];
    const w=(v/totalI*100).toFixed(1);
    return`<div class="pr"><div class="pl">${labels[k]}</div><div class="pbw"><div class="pbf" style="width:${w}%;background:${cols[i%7]}"></div></div><div class="pv">${fmtK(v)} €</div></div>`;
  }).join('');

  document.getElementById('view-dashboard').innerHTML=`
    <div class="g4">
      <div class="sc"><div class="sl">Ingresos YTD</div><div class="sv pos">${fmt(totalI)}</div><div class="ss">${days} días registrados</div></div>
      <div class="sc"><div class="sl">Gastos YTD</div><div class="sv neg">${fmt(totalG)}</div><div class="ss">${Object.keys(byCategory).length} categorías</div></div>
      <div class="sc"><div class="sl">Resultado neto</div><div class="sv ${res>=0?'pos':'neg'}">${fmt(res)}</div><div class="ss">Margen: ${pct(margen)}</div></div>
      <div class="sc"><div class="sl">Media diaria ingresos</div><div class="sv cy">${fmt(days>0?totalI/days:0)}</div><div class="ss">por día activo</div></div>
    </div>
    ${alerts.length?`<div><div class="ct">⚡ Alertas detectadas</div>${alertHtml}</div>`:''}
    <div class="card"><div class="ct">Ingresos vs Gastos por Mes</div><canvas id="cMonthly"></canvas></div>
    <div class="g2">
      <div class="card"><div class="ct">Distribución de Gastos</div><canvas id="cPie"></canvas></div>
      <div class="card"><div class="ct">Canales de Ingreso</div>${channelHtml}</div>
    </div>
  `;

  makeChart('cMonthly',{type:'bar',data:{
    labels:mdata.map(d=>d.mes),
    datasets:[
      {label:'Ingresos',data:mdata.map(d=>d.i),backgroundColor:'#6c63ffbb',borderRadius:4},
      {label:'Gastos',data:mdata.map(d=>d.g),backgroundColor:'#ef4444aa',borderRadius:4},
    ]
  },options:{responsive:true,plugins:{legend:{labels:{color:'#9090b0',font:{size:11}}}},scales:{x:{ticks:{color:'#5a5a7a'}},y:{ticks:{color:'#5a5a7a',callback:v=>fmtK(v)},grid:{color:'#2a2a3a'}}}}});

  makeChart('cPie',{type:'doughnut',data:{
    labels:pieD.map(([k])=>k),
    datasets:[{data:pieD.map(([,v])=>v),backgroundColor:pieD.map(([k])=>CAT_COLORS[k]||'#64748b'),borderWidth:0,hoverOffset:4}]
  },options:{responsive:true,plugins:{legend:{position:'right',labels:{color:'#9090b0',font:{size:10},boxWidth:10}}}}});
}

    return`<tr>
      <td class="mono" style="font-size:11px;color:var(--t3)">${e.fecha}</td>
      <td style="font-size:12px;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.concepto}</td>
      <td><span style="display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:11px;background:${col}22;color:${col};font-weight:600">${e.categoria}</span></td>
      <td style="font-size:12px;color:var(--t2)">${e.forma_pago||''}</td>
      <td class="mono" style="text-align:right;font-weight:700;color:var(--red)">${fmt(e.importe,2)}</td>
    </tr>`;
  }).join('');

  document.getElementById('view-gastos').innerHTML=`
    <div class="g3">
      <div class="sc"><div class="sl">Total Gastos YTD</div><div class="sv neg">${fmt(totalG)}</div><div class="ss">${DATA.expenses.length} movimientos</div></div>
      <div class="sc"><div class="sl">Mayor categoría</div><div class="sv" style="font-size:16px;color:var(--acc2)">${cats[0]?.[0]||'—'}</div><div class="ss">${cats[0]?fmt(cats[0][1]):''}</div></div>
      <div class="sc"><div class="sl">Comisiones banco</div><div class="sv warn">${fmt(byCategory['Comisiones banco']||0)}</div><div class="ss">${pct((byCategory['Comisiones banco']||0)/totalG)} del total</div></div>
    </div>
    <div class="card"><div class="ct">Gasto por categoría <span style="color:var(--t3);font-weight:400">(clic para filtrar)</span></div>${catBars}</div>
    <div class="card"><div class="ct">Gasto mensual ${catFilter!=='all'?`— ${catFilter}`:'(todas las categorías)'}</div><canvas id="cGastosM"></canvas></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div><div class="ct" style="margin-bottom:0">Movimientos de gasto</div><div style="font-size:11px;color:var(--t3);margin-top:3px">${filtered.length} registros</div></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input type="text" style="width:180px;padding:7px 10px" placeholder="Buscar concepto..." oninput="gSearch=this.value.toLowerCase();renderGastos()" value="${gSearch}">
          <button class="fbtn ${catFilter==='all'?'act':''}" onclick="setCatFilter('all')">Todas</button>
          ${['Proveedores','Nóminas/Personal','Comisiones banco','Impuestos/AEAT','Préstamos'].map(c=>`<button class="fbtn ${catFilter===c?'act':''}" onclick="setCatFilter('${c}')">${c}</button>`).join('')}
        </div>
      </div>
      <div style="overflow-x:auto;max-height:460px;overflow-y:auto">
        <table><thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Forma pago</th><th style="text-align:right">Importe</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>
  `;

  const col=catFilter!=='all'?(CAT_COLORS[catFilter]||'#6c63ff'):'#ef4444';
  makeChart('cGastosM',{type:'bar',data:{labels:mGD.map(d=>d.mes),datasets:[{label:'Gasto',data:mGD.map(d=>d.v),backgroundColor:col+'bb',borderRadius:4}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#5a5a7a'}},y:{ticks:{color:'#5a5a7a',callback:v=>fmtK(v)},grid:{color:'#2a2a3a'}}}}});
}
function setCatFilter(c){catFilter=c;renderGastos();}

// ── SALUD FINANCIERA ─────────────────────────────────────────────────────────
function renderSalud(){
  const {totalI,totalG,res,byCategory,byMonth}=STATS;
  const margen=totalI>0?res/totalI:0;
  const comm=(byCategory['Comisiones banco']||0);
  const loans=(byCategory['Préstamos']||0);
  const personal=(byCategory['Nóminas/Personal']||0)+(byCategory['Seg.Sociales TGSS']||0);
  const prov=(byCategory['Proveedores']||0);

  // health score
  let score=50;
  if(margen>.2)score+=20;else if(margen>.1)score+=10;else if(margen>0)score+=5;else score-=20;
  const cr=totalI>0?comm/totalI:0;
  if(cr<.005)score+=10;else if(cr<.01)score+=5;else score-=5;
  const lr=totalG>0?loans/totalG:0;
  if(lr<.05)score+=10;else if(lr<.1)score+=5;else score-=5;
  const ams=Object.values(byMonth).filter(m=>m.i>0);
  const posR=ams.length>0?ams.filter(m=>m.i>m.g).length/ams.length:0;
  score+=posR*10;
  score=Math.max(0,Math.min(100,Math.round(score)));

  const scCol=score>=70?'var(--green)':score>=45?'var(--amb)':'var(--red)';
  const scLbl=score>=70?'✅ Saludable':score>=45?'⚠️ Atención':'🔴 Crítico';
  const circ=2*Math.PI*54;
  const dash=(score/100)*circ;

  // suggestions
  const sugs=[];
  if(comm>500)sugs.push({lv:'warn',t:`Comisiones bancarias: ${fmt(comm)}`,d:'Negociar tarifas TPV con CaixaBank/Sabadell. Ahorro potencial negociando.',sav:comm*.3});
  const otros=(byCategory['Otros']||0);
  if(otros>2000)sugs.push({lv:'warn',t:`"Otros" sin categorizar: ${fmt(otros)}`,d:'Revisar y categorizar correctamente. Pueden esconder gastos recurrentes no controlados.'});
  const tel=(byCategory['Telecomunicaciones']||0);
  if(tel>200)sugs.push({lv:'info',t:`Telecomunicaciones: ${fmt(tel)}`,d:'Auditar contratos fibra, móviles, cloud. Posible ahorro con packs empresa.',sav:tel*.2});
  const seg=(byCategory['Seguros']||0);
  if(seg>300)sugs.push({lv:'info',t:`Seguros: ${fmt(seg)}`,d:'Comparar con brokers. Revisar coberturas duplicadas (Sanitas + otros).',sav:seg*.15});
  if(loans>0)sugs.push({lv:lr>.1?'danger':'warn',t:`Préstamos activos: ${fmt(loans)}`,d:'Priorizar amortización del préstamo con mayor TAE. Evitar nuevo endeudamiento.'});

  // monthly trend
  let acc=0;
  const trend=Object.entries(byMonth).filter(([,v])=>v.i>0||v.g>0).map(([m,v])=>{
    const n=v.i-v.g; acc+=n;
    const mo=parseInt(m.split('-')[1]);
    return{mes:MNAMES[mo],i:v.i,g:v.g,n,acc};
  });

  // ratios
  const ratios=[
    {n:'Margen neto',v:pct(margen),ref:'>15%',ok:margen>.15},
    {n:'Comisiones / Ingresos',v:pct(cr),ref:'<1%',ok:cr<.01},
    {n:'Préstamos / Gastos',v:pct(lr),ref:'<8%',ok:lr<.08},
    {n:'Personal / Gastos',v:pct(personal/totalG),ref:'15-30%',ok:true},
    {n:'Proveedores / Gastos',v:pct(prov/totalG),ref:'40-60%',ok:prov/totalG<.65},
  ];

  document.getElementById('view-salud').innerHTML=`
    <div class="g2">
      <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:16px">Índice de salud financiera</div>
        <div id="scoreRing">
          <svg viewBox="0 0 140 140" width="140" height="140">
            <circle cx="70" cy="70" r="54" fill="none" stroke="var(--s2)" stroke-width="13"/>
            <circle cx="70" cy="70" r="54" fill="none" stroke="${scCol}" stroke-width="13"
              stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"/>
          </svg>
          <div id="scoreLabel">
            <div class="snum" style="color:${scCol}">${score}</div>
            <div class="ssub">/100</div>
          </div>
        </div>
        <div style="font-size:18px;font-weight:700;color:${scCol};margin-bottom:8px">${scLbl}</div>
        <div style="font-size:12px;color:var(--t2);text-align:center">Basado en margen, deuda, comisiones y regularidad</div>
      </div>
      <div class="card"><div class="ct">Evolución mensual</div><canvas id="cTrend"></canvas></div>
    </div>
    <div>
      <div class="ct" style="margin-bottom:10px">🔍 Detección de fugas — Dónde recortar</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${sugs.map(s=>`
          <div class="alert alert-${s.lv}">
            <span style="flex-shrink:0;margin-top:1px">${s.lv==='danger'?'🔴':s.lv==='warn'?'✂️':'💡'}</span>
            <div style="flex:1"><div class="at" style="color:${s.lv==='danger'?'var(--red)':s.lv==='warn'?'var(--amb)':'var(--cy)'}">${s.t}</div><div class="ad2">${s.d}</div></div>
            ${s.sav?`<div style="text-align:right;flex-shrink:0"><div style="font-size:10px;color:var(--t3)">Ahorro est.</div><div style="color:var(--green);font-family:var(--mono);font-weight:700;font-size:15px">~${fmt(s.sav)}</div></div>`:''}
          </div>
        `).join('')}
        ${sugs.length===0?`<div class="alert alert-info"><span>✅</span><div><div class="at" style="color:var(--green)">Sin alertas críticas</div><div class="ad2">Los gastos están dentro de rangos razonables.</div></div></div>`:''}
      </div>
    </div>
    <div class="card">
      <div class="ct">Ratios clave</div>
      <table><thead><tr><th>Indicador</th><th>Valor</th><th>Referencia</th><th>Estado</th></tr></thead>
      <tbody>${ratios.map(r=>`<tr><td>${r.n}</td><td class="mono" style="font-weight:700">${r.v}</td><td style="color:var(--t3);font-size:12px">${r.ref}</td><td><span class="badge ${r.ok?'bg':'br'}">${r.ok?'✓ OK':'⚠ Revisar'}</span></td></tr>`).join('')}</tbody>
      </table>
    </div>
  `;

  makeChart('cTrend',{type:'line',data:{
    labels:trend.map(d=>d.mes),
    datasets:[
      {label:'Ingresos',data:trend.map(d=>d.i),borderColor:'var(--green)',tension:.3,pointRadius:3,fill:false},
      {label:'Gastos',data:trend.map(d=>d.g),borderColor:'var(--red)',tension:.3,pointRadius:3,fill:false},
      {label:'Acumulado',data:trend.map(d=>d.acc),borderColor:'var(--acc)',tension:.3,borderDash:[5,3],pointRadius:4,fill:false},
    ]
  },options:{responsive:true,plugins:{legend:{labels:{color:'#9090b0',font:{size:11}}}},scales:{x:{ticks:{color:'#5a5a7a'}},y:{ticks:{color:'#5a5a7a',callback:v=>fmtK(v)},grid:{color:'#2a2a3a'}}}}});
}

// ── NUEVO REGISTRO ───────────────────────────────────────────────────────────
function renderNuevo(){
  document.getElementById('view-nuevo').innerHTML=`
    <div style="max-width:780px;margin:0 auto;width:100%">
      <div style="font-size:18px;font-weight:700;margin-bottom:16px">Nuevo Cierre Diario</div>
      <div class="card" style="margin-bottom:14px">
        <div class="fg" style="max-width:200px"><label class="fl">Fecha</label><input type="date" id="nfecha" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="card" style="margin-bottom:14px">
        <div class="ct">💰 Ingresos del día</div>
        <div class="g2">
          ${[['caixabank','Datáfono CaixaBank'],['sabadell','Datáfono Sabadell'],['bbva','Datáfono BBVA'],['online','Online/Web'],['paypal','PayPal'],['transferencias','Transferencias'],['efectivo','Efectivo cobrado'],['devoluciones','Devoluciones (−)']].map(([k,l])=>`<div class="fg"><label class="fl">${l}</label><input type="number" step="0.01" min="0" id="i_${k}" placeholder="0.00" oninput="calcNuevo()"></div>`).join('')}
        </div>
        <div style="margin-top:8px;padding:12px;background:var(--s2);border-radius:8px;display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:12px;color:var(--t3)">TOTAL INGRESOS</span>
          <span class="mono pos" id="ntotalI" style="font-size:22px;font-weight:800">0,00 €</span>
        </div>
      </div>
      <div class="card" style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <div class="ct" style="margin-bottom:0">💸 Gastos del día</div>
          <button class="btn btn-s" onclick="addGastoLine()">+ Añadir línea</button>
        </div>
        <div id="gastoLines"></div>
        <div style="margin-top:8px;padding:12px;background:var(--s2);border-radius:8px;display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:12px;color:var(--t3)">TOTAL GASTOS</span>
          <span class="mono neg" id="ntotalG" style="font-size:22px;font-weight:800">0,00 €</span>
        </div>
      </div>
      <div class="card" style="margin-bottom:14px;text-align:center;padding:24px">
        <div style="font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Resultado del día</div>
        <div class="mono" id="nresultado" style="font-size:42px;font-weight:800">0,00 €</div>
        <div id="nmargen" style="font-size:13px;color:var(--t2);margin-top:4px"></div>
      </div>
      <div class="card" style="margin-bottom:20px">
        <div class="ct">📝 Notas</div>
        <textarea id="nnotas" rows="2" placeholder="Proveedor pagado, incidencia, feria..."></textarea>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-p" onclick="saveNuevo()">💾 Guardar cierre del día</button>
        <button class="btn btn-s" onclick="goTab('dashboard',document.querySelector('.nb'))">📊 Ver Dashboard</button>
        <button class="btn btn-s" style="color:var(--red)" onclick="clearExtra()">🗑 Borrar datos añadidos</button>
      </div>
      <div id="nsaved" style="display:none;margin-top:14px" class="alert alert-info">
        <span>✅</span><div><div class="at" style="color:var(--green)">Guardado correctamente</div><div class="ad2">El cierre se ha añadido a los datos.</div></div>
      </div>
    </div>
  `;
  addGastoLine();
}

let gLines=[];
function addGastoLine(){
  const id=Date.now();
  gLines.push(id);
  const div=document.createElement('div');
  div.id='gl_'+id;
  div.style.cssText='display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:end';
  div.innerHTML=`
    <div class="fg" style="margin-bottom:0"><input type="text" placeholder="Concepto / Proveedor" id="gc_${id}" oninput="calcNuevo()"></div>
    <div class="fg" style="margin-bottom:0"><select id="gcat_${id}" onchange="calcNuevo()">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="fg" style="margin-bottom:0"><input type="number" step="0.01" min="0" placeholder="0.00" id="gv_${id}" oninput="calcNuevo()"></div>
    <div class="fg" style="margin-bottom:0"><select id="gp_${id}"><option>Cargo banco</option><option>Tarjeta empresa</option><option>Transferencia</option><option>Efectivo</option></select></div>
    <button onclick="removeGLine(${id})" style="background:none;border:1px solid var(--b2);border-radius:6px;padding:8px 10px;color:var(--t3);cursor:pointer;height:38px">×</button>
  `;
  document.getElementById('gastoLines').appendChild(div);
}
function removeGLine(id){const el=document.getElementById('gl_'+id);if(el)el.remove();gLines=gLines.filter(x=>x!==id);calcNuevo();}
function p(id){return parseFloat(document.getElementById(id)?.value)||0;}
function calcNuevo(){
  const ti=p('i_caixabank')+p('i_sabadell')+p('i_bbva')+p('i_online')+p('i_paypal')+p('i_transferencias')+p('i_efectivo')-p('i_devoluciones');
  const tg=gLines.reduce((s,id)=>s+p('gv_'+id),0);
  const res=ti-tg;
  const fmtL=v=>Math.abs(v).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
  document.getElementById('ntotalI').textContent=fmtL(Math.max(0,ti));
  document.getElementById('ntotalG').textContent=fmtL(tg);
  const el=document.getElementById('nresultado');
  el.textContent=(res>=0?'+':'-')+fmtL(res);
  el.style.color=res>=0?'var(--green)':'var(--red)';
  document.getElementById('nmargen').textContent=ti>0?`Margen: ${pct(res/ti)}`:'';
}
function saveNuevo(){
  const fecha=document.getElementById('nfecha').value;
  if(!fecha)return;
  const ii={caixabank:p('i_caixabank'),sabadell:p('i_sabadell'),bbva:p('i_bbva'),online:p('i_online'),paypal:p('i_paypal'),transferencias:p('i_transferencias'),efectivo:p('i_efectivo'),devoluciones:p('i_devoluciones'),total:0};
  ii.total=ii.caixabank+ii.sabadell+ii.bbva+ii.online+ii.paypal+ii.transferencias+ii.efectivo-ii.devoluciones;
  const exps=gLines.filter(id=>p('gv_'+id)>0).map(id=>({
    fecha,concepto:document.getElementById('gc_'+id)?.value||'',
    categoria:document.getElementById('gcat_'+id)?.value||'Otros',
    importe:p('gv_'+id),forma_pago:document.getElementById('gp_'+id)?.value||''
  }));
  const tg=exps.reduce((s,e)=>s+e.importe,0);
  const daily={fecha,ingresos:ii,gastos:{banco:tg,tarjeta:0,efectivo_gastos:0,total:tg},resultado:ii.total-tg,acumulado:0,notas:document.getElementById('nnotas').value};
  try{
    const stored=localStorage.getItem('er_extra');
    const ex=stored?JSON.parse(stored):{daily:[],expenses:[]};
    ex.daily.push(daily);ex.expenses.push(...exps);
    localStorage.setItem('er_extra',JSON.stringify(ex));
  }catch(_){}
  DATA=loadData();STATS=computeStats(DATA);renderHeader();
  document.getElementById('nsaved').style.display='flex';
  setTimeout(()=>{document.getElementById('nsaved').style.display='none';},4000);
  renderNuevo();
}
function clearExtra(){
  if(!confirm('¿Borrar todos los registros añadidos manualmente?'))return;
  localStorage.removeItem('er_extra');DATA=loadData();STATS=computeStats(DATA);renderHeader();renderNuevo();
}

// ── INIT ─────────────────────────────────────────────────────────────────────
renderHeader();
renderDashboard();
</script>
</body>
</html>
